<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Analytics | ISAI</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <aside class="sidebar">
            <div class="sidebar-header">
                <div class="logo-box"><i data-lucide="cpu"></i></div>
                <div class="logo-text"><h2>IS<span>AI</span></h2><span class="badge">SIH26108</span></div>
            </div>
            <nav class="sidebar-nav">
                <p class="nav-title">MAIN MENU</p>
                <a href="index.html"><i data-lucide="layout-dashboard"></i> <span>Analyzer</span></a>
                <a href="standards.html"><i data-lucide="database"></i> <span>Standards DB</span></a>
                <a href="history.html"><i data-lucide="folder-clock"></i> <span>Tender History</span></a>
                <a href="analytics.html" class="active"><i data-lucide="bar-chart-2"></i> <span>Analytics</span></a>
            </nav>
        </aside>
        <main class="main-content">
            <header class="topbar">
                <div class="breadcrumb"><span class="text-muted">ISAI Platform</span> <i data-lucide="chevron-right"></i> <span class="font-semibold">System Analytics</span></div>
            </header>
            <div class="dashboard-scroll">
                <div class="stats-grid">
                    <div class="stat-card">
                        <div class="stat-icon bg-blue"><i data-lucide="zap"></i></div>
                        <div class="stat-info"><p>Avg. Processing Time</p><h3>1.2s</h3></div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-icon bg-purple"><i data-lucide="shield-check"></i></div>
                        <div class="stat-info"><p>Compliance Rate</p><h3>99.1%</h3></div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-icon bg-green"><i data-lucide="file-check"></i></div>
                        <div class="stat-info"><p>Total Tenders Audited</p><h3>1,420</h3></div>
                    </div>
                </div>
            </div>
        </main>
    </div>
    <script>lucide.createIcons();</script>
</body>
</html>
