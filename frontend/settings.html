<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Settings | ISAI</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <div class="logo-box"><i data-lucide="cpu"></i></div>
                <div class="logo-text"><h2>IS<span>AI</span></h2><span class="badge">SIH26108</span></div>
            </div>
            <nav class="sidebar-nav">
                <p class="nav-title">MAIN MENU</p>
                <a href="index.html"><i data-lucide="layout-dashboard"></i> <span>Analyzer</span></a>
                <a href="standards.html"><i data-lucide="database"></i> <span>Standards DB</span></a>
                <a href="history.html"><i data-lucide="folder-clock"></i> <span>Tender History</span></a>
                <a href="analytics.html"><i data-lucide="bar-chart-2"></i> <span>Analytics</span></a>
                
                <p class="nav-title mt-4">SYSTEM</p>
                <a href="settings.html" class="active"><i data-lucide="settings"></i> <span>Settings</span></a>
                <a href="docs.html"><i data-lucide="help-circle"></i> <span>Documentation</span></a>
            </nav>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <header class="topbar">
                <div class="breadcrumb"><span class="text-muted">ISAI Platform</span> <i data-lucide="chevron-right"></i> <span class="font-semibold">System Settings</span></div>
            </header>
            <div class="dashboard-scroll">
                <div class="card" style="padding: 24px; max-width: 600px;">
                    <div class="card-header">
                        <h3><i data-lucide="settings"></i> Configuration Panel</h3>
                    </div>
                    
                    <div style="margin-top: 24px;">
                        <h4 style="margin-bottom: 8px; font-size: 14px;">AI Model Selection</h4>
                        <select style="width: 100%; padding: 12px; border-radius: 8px; border: 1px solid var(--border); background: var(--surface); color: var(--text-color); margin-bottom: 24px;">
                            <option>Gemini 3.8 (Default)</option>
                            <option>Gemini Advanced (High Accuracy)</option>
                            <option>Local Vector Only (Offline Mode)</option>
                        </select>

                        <h4 style="margin-bottom: 8px; font-size: 14px;">API Endpoint</h4>
                        <input type="text" value="http://127.0.0.1:5001" style="width: 100%; padding: 12px; border-radius: 8px; border: 1px solid var(--border); background: var(--surface); color: var(--text-color); margin-bottom: 24px;">

                        <div style="display: flex; justify-content: space-between; align-items: center; padding: 16px; background: var(--bg-color); border-radius: 8px; border: 1px solid var(--border);">
                            <div>
                                <h4 style="font-size: 14px;">Dark Mode</h4>
                                <p style="font-size: 12px; color: var(--text-muted);">Enable high-contrast dark theme</p>
                            </div>
                            <span class="badge-gray">Coming Soon</span>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>
    
    <div id="toast-container" class="toast-container"></div>
    <script src="script.js"></script>
</body>
</html>
